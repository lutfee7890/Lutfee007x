<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyCAREER ANALYST — ระบบวิเคราะห์ผู้เล่น</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --court-bg:#0D1017;
    --panel:#161B24;
    --panel-2:#1C2330;
    --wood:#B8763A;
    --wood-dim:#5A3E23;
    --amber:#F2B705;
    --teal:#2FB8C6;
    --crimson:#E2483D;
    --ink:#ECE7DE;
    --ink-dim:#8B93A1;
    --line:#262E3D;
    --bronze:#A2673A;
    --silver:#9AA4AC;
    --gold:#E8B84B;
    --amethyst:#9B5DE5;
    --diamond:#FF6FA5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    position:relative;
    overflow-x:hidden;
    background: var(--court-bg);
    color:var(--ink);
    font-family:'Noto Sans Thai','Chakra Petch',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .top-accent-bar{
    position:fixed;top:0;left:0;right:0;height:4px;z-index:5;
    background:linear-gradient(90deg,var(--wood),var(--amber),var(--teal),var(--crimson),var(--wood));
    background-size:300% 100%;
    animation:accentShift 14s linear infinite;
  }
  @keyframes accentShift{0%{background-position:0% 0;}100%{background-position:300% 0;}}
  .bg-watermark{
    position:fixed;right:-3vw;bottom:-4vh;z-index:0;pointer-events:none;
    font-family:'Chakra Petch';font-weight:700;font-size:clamp(70px,24vw,220px);
    color:rgba(242,183,5,0.035);letter-spacing:6px;white-space:nowrap;
    transform:rotate(-7deg);line-height:1;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(circle at 50% -6%, transparent 0 17%, rgba(242,183,5,0.07) 17% 17.6%, transparent 17.6% 29%, rgba(47,184,198,0.055) 29% 29.6%, transparent 29.6%),
      radial-gradient(circle at 12% 0%, rgba(184,118,58,0.13), transparent 45%),
      radial-gradient(circle at 92% 12%, rgba(47,184,198,0.11), transparent 42%),
      repeating-linear-gradient(180deg, rgba(255,255,255,0.014) 0px, rgba(255,255,255,0.014) 1px, transparent 1px, transparent 3px);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      linear-gradient(180deg, transparent 0%, transparent 76%, rgba(184,118,58,0.09) 88%, rgba(184,118,58,0.15) 100%),
      repeating-linear-gradient(90deg, rgba(184,118,58,0.045) 0 26px, rgba(90,62,35,0.05) 26px 52px);
    mask-image: linear-gradient(180deg, transparent 0%, transparent 68%, black 94%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, transparent 68%, black 94%);
    box-shadow: inset 0 0 180px 50px rgba(0,0,0,0.55);
  }
  .display{font-family:'Chakra Petch','Noto Sans Thai',sans-serif;}
  #app{max-width:720px;margin:0 auto;padding:24px 16px 80px;position:relative;z-index:1;}

  /* ---- top bar ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;position:relative;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber);}
  .brand span{font-family:'Chakra Petch';font-weight:700;letter-spacing:2px;font-size:13px;color:var(--ink-dim);text-transform:uppercase;}
  .icon-btn{background:none;border:1px solid var(--line);color:var(--ink-dim);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:'Noto Sans Thai';}
  .icon-btn:hover{border-color:var(--crimson);color:var(--crimson);}

  .account-pill{
    display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:6px 14px 6px 6px;cursor:pointer;position:relative;
  }
  .account-pill .avatar{
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Chakra Petch';font-weight:700;font-size:12px;color:#161B24;flex-shrink:0;
  }
  .account-pill .acc-label{font-size:12.5px;color:var(--ink-dim);font-weight:600;}
  .account-pill .acc-label b{color:var(--ink);font-weight:600;}
  .account-dropdown{
    position:absolute;top:calc(100% + 8px);left:0;background:var(--panel-2);border:1px solid var(--line);
    border-radius:12px;padding:6px;min-width:170px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,0.4);
  }
  .account-dropdown button{
    width:100%;text-align:left;background:none;border:none;color:var(--ink);font-family:'Noto Sans Thai';
    font-size:13.5px;padding:9px 10px;border-radius:8px;cursor:pointer;
  }
  .account-dropdown button:hover{background:rgba(255,255,255,0.05);}
  .account-dropdown button.danger{color:var(--crimson);}
  .account-dropdown .divider{height:1px;background:var(--line);margin:4px 0;}

  /* ---- setup screen ---- */
  .setup-card{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 22px;
    margin-top:10px;
  }
  .setup-card h1{
    font-family:'Chakra Petch';font-weight:700;font-size:22px;margin:0 0 4px;
    background:linear-gradient(90deg,var(--amber),var(--wood));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .setup-card p.sub{color:var(--ink-dim);font-size:13.5px;margin:0 0 22px;line-height:1.6;}
  label{display:block;font-size:12.5px;color:var(--ink-dim);margin:14px 0 6px;font-weight:600;}
  .label-row{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px;}
  .label-row label{margin:0;}
  .dice-btn{
    background:rgba(47,184,198,0.08);border:1px solid rgba(47,184,198,0.3);color:var(--teal);
    border-radius:8px;padding:4px 10px;font-size:11.5px;font-family:'Noto Sans Thai';font-weight:600;cursor:pointer;
  }
  .dice-btn:hover{background:rgba(47,184,198,0.16);}
  input[type=text], input[type=number], input[type=password], select, textarea{
    width:100%;background:#0F131B;border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:11px 12px;font-size:15px;font-family:'Noto Sans Thai';
    outline:none;transition:border-color .15s;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--teal);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .primary-btn{
    width:100%;margin-top:22px;border:none;border-radius:12px;padding:14px;
    font-family:'Chakra Petch';font-weight:700;font-size:15px;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--wood),var(--amber));color:#1a1206;cursor:pointer;
    transition:transform .1s;
  }
  .primary-btn:active{transform:scale(0.98);}
  .primary-btn:disabled{opacity:.5;cursor:not-allowed;}
  .ghost-btn{
    width:100%;margin-top:10px;border:1px solid var(--line);background:none;color:var(--ink-dim);
    border-radius:12px;padding:12px;font-family:'Noto Sans Thai';font-size:14px;cursor:pointer;
  }
  .admin-link-row{text-align:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}
  .admin-link{background:none;border:none;color:var(--ink-dim);font-size:11.5px;font-family:'Noto Sans Thai';cursor:pointer;opacity:.7;}
  .admin-link:hover{color:var(--crimson);opacity:1;}

  /* ---- player hero card ---- */
  .hero{
    background:linear-gradient(160deg,var(--panel) 0%,var(--panel-2) 100%);
    border:1px solid var(--line);border-radius:20px;padding:22px;position:relative;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;top:-40%;right:-20%;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(242,183,5,0.12),transparent 70%);
  }
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;position:relative;z-index:1;}
  .p-name{font-family:'Chakra Petch';font-weight:700;font-size:21px;margin:0;}
  .p-meta{color:var(--ink-dim);font-size:13px;margin-top:4px;letter-spacing:.3px;}
  .p-meta b{color:var(--teal);font-weight:600;}
  .streak-tag{
    display:inline-flex;align-items:center;gap:4px;margin-top:8px;padding:4px 10px;border-radius:20px;
    background:rgba(226,72,61,0.12);border:1px solid rgba(226,72,61,0.35);color:#ff9d94;
    font-size:11.5px;font-weight:700;font-family:'Chakra Petch';letter-spacing:.3px;
  }

  .ovr-badge{
    width:82px;height:92px;flex-shrink:0;position:relative;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
    transition:transform .4s ease;
  }
  .ovr-badge.bump{animation:levelup .7s ease;}
  @keyframes levelup{
    0%{transform:scale(1);}
    35%{transform:scale(1.18) rotate(-3deg);}
    60%{transform:scale(0.95) rotate(2deg);}
    100%{transform:scale(1);}
  }
  .ovr-num{font-family:'Chakra Petch';font-weight:700;font-size:26px;line-height:1;color:#161B24;}
  .ovr-lbl{font-family:'Chakra Petch';font-size:9px;font-weight:600;letter-spacing:1px;color:#161B24cc;margin-top:2px;}
  .tier-tag{text-align:right;font-size:11px;font-weight:600;letter-spacing:.5px;margin-top:6px;}

  .confetti-piece{
    position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:1px;
    transform:translate(-50%,-50%);opacity:0;pointer-events:none;
    animation:confettiPop .9s ease-out forwards;
  }
  @keyframes confettiPop{
    0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--angle)) translateX(0) scale(1);}
    100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--angle)) translateX(var(--dist)) scale(0.3);}
  }

  .chip-row{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;position:relative;z-index:1;}
  .chip{
    background:#0F131B;border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center;flex:1;min-width:64px;
  }
  .chip .v{font-family:'Chakra Petch';font-weight:700;font-size:16px;color:var(--amber);}
  .chip .k{font-size:10.5px;color:var(--ink-dim);letter-spacing:.5px;margin-top:2px;}

  /* ---- chart ---- */
  .chart-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 14px;margin-top:16px;}
  .chart-card h3{font-family:'Chakra Petch';font-size:13px;letter-spacing:1px;color:var(--ink-dim);margin:0 0 10px;text-transform:uppercase;}
  .chart-wrap{height:150px;}

  .ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .ach-item{
    display:flex;align-items:center;gap:8px;background:#0F131B;border:1px solid var(--line);
    border-radius:10px;padding:9px 10px;opacity:.35;filter:grayscale(1);
  }
  .ach-item.unlocked{opacity:1;filter:none;border-color:rgba(242,183,5,0.3);background:rgba(242,183,5,0.05);}
  .ach-icon{font-size:18px;flex-shrink:0;}
  .ach-label{font-size:11px;line-height:1.35;color:var(--ink-dim);}
  .ach-item.unlocked .ach-label{color:var(--ink);}

  /* ---- round form trigger ---- */
  .new-round-btn{
    width:100%;margin-top:16px;border:1px dashed var(--wood);background:rgba(184,118,58,0.08);
    color:var(--amber);border-radius:14px;padding:16px;font-family:'Chakra Petch';font-weight:600;
    font-size:14.5px;letter-spacing:.4px;cursor:pointer;
  }
  .new-round-btn:hover{background:rgba(184,118,58,0.15);}

  .form-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px;}
  .form-card h3{font-family:'Chakra Petch';font-size:15px;margin:0 0 2px;}
  .form-card .hint{color:var(--ink-dim);font-size:12px;margin:0 0 14px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

  .mode-toggle{display:flex;gap:8px;margin:14px 0 12px;}
  .mode-btn{flex:1;background:#0F131B;border:1px solid var(--line);color:var(--ink-dim);border-radius:10px;
    padding:9px 6px;font-size:12.5px;font-family:'Noto Sans Thai';font-weight:600;cursor:pointer;}
  .mode-btn.active{border-color:var(--teal);color:var(--teal);background:rgba(47,184,198,0.08);}
  .pg-row{background:#0F131B;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
  .pg-row-head{font-family:'Chakra Petch';font-weight:600;font-size:12.5px;color:var(--ink-dim);margin-bottom:8px;display:flex;justify-content:space-between;}
  .pg-remove{background:none;border:none;color:var(--crimson);font-size:11.5px;cursor:pointer;font-family:'Noto Sans Thai';}

  .btn-pair{display:flex;gap:10px;margin-top:18px;}
  .btn-pair .primary-btn{margin-top:0;}
  .btn-pair .ghost-btn{margin-top:0;flex:0 0 auto;width:auto;padding:12px 18px;}

  /* ---- loading ---- */
  .loading-card{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;margin-top:16px;
    text-align:center;
  }
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--amber);
    margin:0 auto 14px;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-card p{color:var(--ink-dim);font-size:13.5px;margin:0;}

  /* ---- analysis result ---- */
  .analysis-card{
    background:linear-gradient(160deg,#171B24,#1a2130);
    border:1px solid var(--teal);border-radius:18px;padding:20px;margin-top:16px;
    box-shadow:0 0 0 1px rgba(47,184,198,0.15), 0 8px 30px rgba(47,184,198,0.08);
  }
  .analysis-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .analysis-top .grade{
    font-family:'Chakra Petch';font-weight:700;font-size:22px;border-radius:10px;padding:4px 12px;flex-shrink:0;
  }
  .headline{font-family:'Chakra Petch';font-weight:700;font-size:18px;margin:2px 0 10px;color:var(--amber);line-height:1.35;}
  .ovr-delta{display:inline-block;font-family:'Chakra Petch';font-weight:700;font-size:13px;padding:3px 10px;
    border-radius:20px;margin-bottom:12px;}
  .commentary{font-size:14.5px;line-height:1.75;color:var(--ink);margin:0 0 14px;}
  .highlights{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:7px;}
  .highlights li{font-size:13.5px;line-height:1.5;background:rgba(242,183,5,0.06);border-left:3px solid var(--amber);
    padding:8px 10px;border-radius:6px;}
  .tactical{background:rgba(47,184,198,0.07);border:1px solid rgba(47,184,198,0.25);border-radius:10px;padding:12px 14px;}
  .tactical h4{margin:0 0 6px;font-family:'Chakra Petch';font-size:12.5px;letter-spacing:.5px;color:var(--teal);text-transform:uppercase;}
  .tactical p{margin:0;font-size:13.5px;line-height:1.65;}

  /* ---- history ---- */
  .history{margin-top:22px;}
  .history h3{font-family:'Chakra Petch';font-size:13px;letter-spacing:1px;color:var(--ink-dim);text-transform:uppercase;margin:0 0 10px;}
  .h-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
  .h-item-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .h-item-top .rn{font-family:'Chakra Petch';font-weight:700;font-size:13px;color:var(--ink-dim);}
  .h-item-top .hl{font-size:13.5px;font-weight:600;flex:1;margin:0 10px;}
  .h-item-top .delta{font-family:'Chakra Petch';font-weight:700;font-size:12.5px;}
  .h-item-body{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:1.6;color:var(--ink-dim);}
  .h-item.open .h-item-body{display:block;}

  .storage-note{background:rgba(154,164,172,0.08);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--ink-dim);line-height:1.5;}

  .error-box{background:rgba(226,72,61,0.1);border:1px solid var(--crimson);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:13.5px;color:#ffb3ae;}

  .confirm-overlay{
    position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.65);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .confirm-box{
    background:var(--panel-2);border:1px solid var(--crimson);border-radius:16px;padding:22px;max-width:340px;width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  .confirm-box p{margin:0 0 4px;font-size:14.5px;line-height:1.6;color:var(--ink);}

  .empty-hist{color:var(--ink-dim);font-size:13px;text-align:center;padding:14px 0;}

  ::selection{background:var(--teal);color:#0D1017;}
</style>
</head>
<body>
<div class="top-accent-bar"></div>
<div class="bg-watermark">MyCAREER</div>
<div id="app"></div>

<script>
const STORAGE_KEY = 'mycareer_profiles_v2';
const ADMIN_NAME = 'admin';
const ADMIN_PASS = 'lutfee789';
let state = {
  allProfiles: {}, profile: null, currentProfileName: null,
  authMode: 'login', authError: null,
  formOpen:false, loading:false, error:null, lastResultRoundIdx:null, openHistIdx:null,
  storageOk:true, storageWarned:false, accountMenuOpen:false,
  isAdmin:false, adminError:null, adminView:'list', adminEditingName:null, adminEditingRoundIdx:null,
  roundEntryMode:'avg', perGameRows:[], confirmModal:null
};

const POSITIONS = ['PG','SG','SF','PF','C'];

const NBA_TEAMS = [
  'Atlanta Hawks','Boston Celtics','Brooklyn Nets','Charlotte Hornets','Chicago Bulls',
  'Cleveland Cavaliers','Dallas Mavericks','Denver Nuggets','Detroit Pistons','Golden State Warriors',
  'Houston Rockets','Indiana Pacers','LA Clippers','Los Angeles Lakers','Memphis Grizzlies',
  'Miami Heat','Milwaukee Bucks','Minnesota Timberwolves','New Orleans Pelicans','New York Knicks',
  'Oklahoma City Thunder','Orlando Magic','Philadelphia 76ers','Phoenix Suns','Portland Trail Blazers',
  'Sacramento Kings','San Antonio Spurs','Toronto Raptors','Utah Jazz','Washington Wizards'
];

const FIRST_NAMES = ['Somchai','Anan','Chai','Tanawat','Nattapong','Kittipong','Panupong','Sarawut','Wichai','Decha','Marcus','Xavier','Isaiah','Dominique','Trey','Jamal','Andre','Malik','Devin','Cole'];
const LAST_NAMES = ['Prasert','Suksawat','Thongchai','Wattana','Boonmee','Charoen','Saetang','Rungrueang','Chaiyasit','Ruangrit','Johnson','Carter','Bailey','Sinclair','Reynolds','Bennett','Coleman','Hayes','Marsh','Kingston'];
const NICKNAMES = ['The Blur','Ice','Flash','Hollywood','The Wall','Sniper','Rocket','Showtime','The Ghost','Cyclone','Prime Time','The Answer','Lockdown','Silk','The Machine'];

function randomFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function randomPlayerName(){
  const first = randomFrom(FIRST_NAMES);
  const last = randomFrom(LAST_NAMES);
  if(Math.random() < 0.55){
    return `${first} '${randomFrom(NICKNAMES)}' ${last}`;
  }
  return `${first} ${last}`;
}

function tierInfo(ovr){
  if(ovr>=90) return {name:'พิงค์ไดมอนด์', color:'var(--diamond)'};
  if(ovr>=85) return {name:'อเมทิสต์', color:'var(--amethyst)'};
  if(ovr>=80) return {name:'โกลด์', color:'var(--gold)'};
  if(ovr>=70) return {name:'ซิลเวอร์', color:'var(--silver)'};
  return {name:'บรอนซ์', color:'var(--bronze)'};
}

async function loadAllProfiles(){
  let loaded = false;
  try{
    if(window.storage){
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res){
        const parsed = JSON.parse(res.value);
        state.allProfiles = parsed.profiles || {};
        loaded = true;
      }
    }
  }catch(e){ /* key not found or no cloud storage here — try local next */ }

  if(!loaded){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        state.allProfiles = parsed.profiles || {};
      }
    }catch(e){ /* localStorage unavailable — start empty, in-memory only */ }
  }

  state.authMode = Object.keys(state.allProfiles).length > 0 ? 'login' : 'create';
  render();
}

async function persistAllProfiles(){
  const payload = JSON.stringify({profiles: state.allProfiles});
  let saved = false;

  try{
    if(window.storage){
      const result = await window.storage.set(STORAGE_KEY, payload, false);
      if(result) saved = true;
    }
  }catch(e){ /* fall through to localStorage */ }

  if(!saved){
    try{
      localStorage.setItem(STORAGE_KEY, payload);
      saved = true;
    }catch(e){ /* both persistence layers unavailable */ }
  }

  if(saved){
    state.storageOk = true;
  } else {
    // Nothing could persist — keep going with in-memory state so the app stays usable
    // for the current session, but let the person know data won't survive a reload.
    state.storageOk = false;
    if(!state.storageWarned){
      state.storageWarned = true;
      render();
    }
  }
}

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderTopbar());
  if(!state.storageOk && state.storageWarned){
    app.appendChild(el(`<div class="storage-note">💾 หมายเหตุ: เบราว์เซอร์นี้บล็อกการบันทึกข้อมูล (เช่นโหมดส่วนตัว) ข้อมูลจะหายเมื่อปิดหน้าต่างนี้</div>`));
  }
  if(state.isAdmin){
    app.appendChild(renderAdmin());
  } else if(!state.profile){
    app.appendChild(renderAuth());
  } else {
    app.appendChild(renderDashboard());
  }
  if(state.confirmModal){
    document.body.appendChild(renderConfirmModal());
  }
}

function showConfirm(message, onConfirm){
  state.confirmModal = { message, onConfirm };
  render();
}

function renderConfirmModal(){
  const m = state.confirmModal;
  const overlay = el(`
    <div class="confirm-overlay">
      <div class="confirm-box">
        <p>${escapeHtml(m.message)}</p>
        <div class="btn-pair">
          <button class="primary-btn" id="confirmYes" style="background:linear-gradient(90deg,var(--crimson),#ff8a7f);">ยืนยันลบ</button>
          <button class="ghost-btn" id="confirmNo">ยกเลิก</button>
        </div>
      </div>
    </div>
  `);
  overlay.querySelector('#confirmYes').onclick = async ()=>{
    const action = state.confirmModal.onConfirm;
    state.confirmModal = null;
    overlay.remove();
    await action();
  };
  overlay.querySelector('#confirmNo').onclick = ()=>{
    state.confirmModal = null;
    overlay.remove();
  };
  return overlay;
}

function renderTopbar(){
  const tier = state.profile ? tierInfo(state.profile.ovr) : null;
  const initial = state.profile ? state.profile.name.trim().charAt(0).toUpperCase() : '';

  const bar = el(`
    <div class="topbar">
      <div class="account-pill" id="accountPill">
        ${state.isAdmin
          ? `<div class="avatar" style="background:var(--crimson);">🛠️</div>
             <span class="acc-label"><b>โหมดแอดมิน</b></span>`
          : state.profile
          ? `<div class="avatar" style="background:${tier.color};">${escapeHtml(initial)}</div>
             <span class="acc-label"><b>${escapeHtml(state.profile.name)}</b></span>`
          : `<div class="avatar" style="background:var(--ink-dim);">👤</div>
             <span class="acc-label">เข้าสู่ระบบ</span>`
        }
      </div>
      <div class="brand"><div class="dot"></div><span>MyCAREER Analyst</span></div>
    </div>
  `);

  const pill = bar.querySelector('#accountPill');

  if(state.isAdmin){
    pill.onclick = (ev)=>{
      ev.stopPropagation();
      state.accountMenuOpen = !state.accountMenuOpen;
      render();
    };
    if(state.accountMenuOpen){
      const dd = el(`
        <div class="account-dropdown">
          <button id="adminLogoutBtn">🚪 ออกจากโหมดแอดมิน</button>
        </div>
      `);
      dd.querySelector('#adminLogoutBtn').onclick = (ev)=>{
        ev.stopPropagation();
        state.isAdmin = false; state.accountMenuOpen = false;
        state.adminView='list'; state.adminEditingName=null; state.adminEditingRoundIdx=null;
        state.authMode = Object.keys(state.allProfiles).length > 0 ? 'login' : 'create';
        render();
      };
      pill.appendChild(dd);
    }
  } else if(state.profile){
    pill.onclick = (ev)=>{
      ev.stopPropagation();
      state.accountMenuOpen = !state.accountMenuOpen;
      render();
    };
    if(state.accountMenuOpen){
      const dd = el(`
        <div class="account-dropdown">
          <button id="logoutBtn">🚪 ออกจากระบบ</button>
          <div class="divider"></div>
          <button id="deleteBtn" class="danger">🗑️ ลบตัวละครนี้ถาวร</button>
        </div>
      `);
      dd.querySelector('#logoutBtn').onclick = (ev)=>{
        ev.stopPropagation();
        state.profile = null; state.currentProfileName = null; state.accountMenuOpen = false;
        state.formOpen=false; state.error=null; state.lastResultRoundIdx=null; state.openHistIdx=null;
        state.authMode = Object.keys(state.allProfiles).length > 0 ? 'login' : 'create';
        state.authError = null;
        render();
      };
      dd.querySelector('#deleteBtn').onclick = (ev)=>{
        ev.stopPropagation();
        state.accountMenuOpen = false;
        showConfirm('ต้องการลบตัวละครนี้ถาวรใช่หรือไม่? การกระทำนี้ย้อนกลับไม่ได้', async ()=>{
          delete state.allProfiles[state.currentProfileName];
          await persistAllProfiles();
          state.profile = null; state.currentProfileName = null;
          state.formOpen=false; state.error=null; state.lastResultRoundIdx=null; state.openHistIdx=null;
          state.authMode = Object.keys(state.allProfiles).length > 0 ? 'login' : 'create';
          render();
        });
      };
      pill.appendChild(dd);
    }
  } else {
    pill.onclick = ()=>{ state.authMode='login'; state.authError=null; render(); };
  }

  return bar;
}

document.addEventListener('click', ()=>{
  if(state.accountMenuOpen){ state.accountMenuOpen = false; render(); }
});

function renderAuth(){
  if(state.authMode === 'admin-login') return renderAdminLoginForm();
  return state.authMode === 'login' ? renderLoginForm() : renderCreateForm();
}

function renderCreateForm(){
  const card = el(`
    <div class="setup-card">
      <h1>สร้างตัวละครนักบาสของคุณ</h1>
      <p class="sub">กรอกข้อมูลเริ่มต้น ตั้งรหัสผ่านของคุณเอง แล้วให้ระบบผู้บรรยายอัจฉริยะติดตามพัฒนาการของคุณตลอดเส้นทางสู่ซูเปอร์สตาร์</p>
      <div class="label-row">
        <label>ชื่อนักกีฬา</label>

          </datalist>
        </div>
      </div>

      ${Object.keys(state.allProfiles).length>0 ? '<button class="ghost-btn" id="toLogin">มีตัวละครอยู่แล้ว? เข้าสู่ระบบ</button>' : ''}
      <div class="admin-link-row"><button type="button" class="admin-link" id="toAdmin">⚙️ เมนูแอดมิน</button></div>
    </div>
  `);
  card.querySelector('#toAdmin').onclick = ()=>{ state.authMode='admin-login'; state.adminError=null; render(); };
  const toLogin = card.querySelector('#toLogin');
  if(toLogin) toLogin.onclick = ()=>{ state.authMode='login'; state.authError=null; render(); };
  card.querySelector('#randNameBtn').onclick = ()=>{
    card.querySelector('#setupName').value = randomPlayerName();
  };
  card.querySelector('#randTeamBtn').onclick = ()=>{
    card.querySelector('#setupTeam').value = randomFrom(NBA_TEAMS);
  };
  card.querySelector('#startBtn').onclick = async ()=>{
    const name = card.querySelector('#setupName').value.trim();
    const pos = card.querySelector('#setupPos').value;
    const team = card.querySelector('#setupTeam').value.trim();
    const pass = card.querySelector('#setupPass').value;
    let startOvr = Math.round(parseFloat(card.querySelector('#setupOvr').value));
    if(isNaN(startOvr)) startOvr = 60;
    startOvr = Math.max(40, Math.min(99, startOvr));
    if(!name || !team || !pass){ alert('กรุณากรอกชื่อนักกีฬา ทีม และรหัสผ่านให้ครบ'); return; }
    if(state.allProfiles[name]){ alert('มีตัวละครชื่อนี้อยู่แล้ว กรุณาใช้ชื่ออื่น หรือเข้าสู่ระบบด้วยชื่อนี้'); return; }

    state.currentProfileName = name;

    render();
  };
  return card;

function renderAdmin(){
  return state.adminView === 'detail' ? renderAdminDetail() : renderAdminList();
}

function renderAdminList(){
  const wrap = document.createElement('div');
  const names = Object.keys(state.allProfiles);
  wrap.appendChild(el(`
    <div class="setup-card" style="padding:20px 22px;">
      <h1 style="font-size:19px;">แผงควบคุมแอดมิน</h1>
      <p class="sub" style="margin-bottom:6px;">ตัวละครทั้งหมดในระบบ: ${names.length} ตัว</p>
    </div>
  `));
  if(names.length === 0){
    wrap.appendChild(el(`<div class="empty-hist">ยังไม่มีตัวละครในระบบ</div>`));
    return wrap;
  }
  const list = el(`<div style="margin-top:12px;"></div>`);
  names.forEach(name=>{
    const p = state.allProfiles[name];
    const tier = tierInfo(p.ovr);
    const item = el(`
      <div class="h-item" style="cursor:pointer;">
        <div class="h-item-top">
          <div class="rn" style="color:${tier.color};font-size:15px;">${p.ovr}</div>
          <div class="hl">${escapeHtml(p.name)}</div>
          <div class="delta" style="color:var(--ink-dim);font-weight:400;">${p.position} · ${escapeHtml(p.team)} · ${p.rounds.length} รอบ</div>
        </div>
      </div>
    `);
    item.onclick = ()=>{
      state.adminEditingName = name;
      state.adminView = 'detail';
      state.adminEditingRoundIdx = null;
      render();
    };
    list.appendChild(item);
  });
  wrap.appendChild(list);
  return wrap;
}

function renderAdminDetail(){
  const wrap = document.createElement('div');
  const name = state.adminEditingName;
  const p = state.allProfiles[name];

  const backBtn = el(`<button class="ghost-btn" style="margin-top:0;">← กลับไปรายชื่อทั้งหมด</button>`);
  backBtn.onclick = ()=>{ state.adminView='list'; state.adminEditingName=null; render(); };
  wrap.appendChild(backBtn);

  if(!p){
    wrap.appendChild(el(`<div class="empty-hist" style="margin-top:14px;">ไม่พบตัวละครนี้ (อาจถูกลบไปแล้ว)</div>`));
    return wrap;
  }

  const tier = tierInfo(p.ovr);
  const card = el(`
    <div class="form-card" style="margin-top:14px;">
      <h3>แก้ไขข้อมูลตัวละคร</h3>
      <p class="hint">แก้ไขข้อมูลพื้นฐาน ตำแหน่ง ทีม OVR ปัจจุบัน หรือรีเซ็ตรหัสผ่านให้ผู้เล่นคนนี้</p>
      <label>ชื่อนักกีฬา</label>
      <input type="text" id="adEditName" value="${escapeHtml(p.name)}">
      <div class="row2">
        <div>
          <label>ตำแหน่ง</label>
          <select id="adEditPos">${POSITIONS.map(pos=>`<option value="${pos}" ${pos===p.position?'selected':''}>${pos}</option>`).join('')}</select>
        </div>
        <div>
          <label>ทีม</label>
          <input type="text" id="adEditTeam" list="nbaTeamList" value="${escapeHtml(p.team)}">
          <datalist id="nbaTeamList">${NBA_TEAMS.map(t=>`<option value="${t}">`).join('')}</datalist>
        </div>
      </div>
      <label>OVR ปัจจุบัน (40-99) — ปัจจุบันคือระดับ ${tier.name}</label>
      <input type="number" id="adEditOvr" value="${p.ovr}" min="40" max="99">
      <label>ตั้งรหัสผ่านใหม่ (เว้นว่างไว้ถ้าไม่เปลี่ยน)</label>
      <input type="password" id="adEditPass" placeholder="รหัสผ่านใหม่">
      <div class="btn-pair">
        <button class="primary-btn" id="adSaveProfile">💾 บันทึกการแก้ไข</button>
        <button class="ghost-btn" id="adDeleteProfile" style="border-color:var(--crimson);color:var(--crimson);">ลบตัวละครนี้</button>
      </div>
    </div>
  `);
  card.querySelector('#adSaveProfile').onclick = async ()=>{
    const newName = card.querySelector('#adEditName').value.trim();
    const newPos = card.querySelector('#adEditPos').value;
    const newTeam = card.querySelector('#adEditTeam').value.trim();
    let newOvr = Math.round(parseFloat(card.querySelector('#adEditOvr').value));
    const newPass = card.querySelector('#adEditPass').value;
    if(!newName || !newTeam){ alert('กรุณากรอกชื่อและทีมให้ครบ'); return; }
    if(isNaN(newOvr)) newOvr = p.ovr;
    newOvr = Math.max(40, Math.min(99, newOvr));

    if(newName !== name && state.allProfiles[newName]){
      alert('มีชื่อนี้ถูกใช้ไปแล้ว กรุณาใช้ชื่ออื่น'); return;
    }

    p.name = newName; p.position = newPos; p.team = newTeam; p.ovr = newOvr;
    if(newPass) p.password = newPass;

    if(newName !== name){
      delete state.allProfiles[name];
      state.allProfiles[newName] = p;
      state.adminEditingName = newName;
    }
    await persistAllProfiles();
    render();
  };
  card.querySelector('#adDeleteProfile').onclick = ()=>{
    showConfirm(`ต้องการลบตัวละคร "${p.name}" ถาวรใช่หรือไม่? การกระทำนี้ย้อนกลับไม่ได้`, async ()=>{
      delete state.allProfiles[state.adminEditingName];
      await persistAllProfiles();
      state.adminView = 'list'; state.adminEditingName = null;
      render();
    });
  };
  wrap.appendChild(card);

  const histWrap = el(`<div class="history" style="margin-top:20px;"><h3>ประวัติการแข่งขัน (แก้ไขได้)</h3></div>`);

    histWrap.appendChild(el(`<div class="empty-hist">ยังไม่มีข้อมูลรอบการแข่งขัน</div>`));
  } else {
    [...p.rounds].reverse().forEach(r=>{
      const idx = p.rounds.indexOf(r);
      histWrap.appendChild(renderAdminRoundItem(p, r, idx));
    });
  }
  wrap.appendChild(histWrap);

  return wrap;
}

function renderAdminRoundItem(p, r, idx){
  if(state.adminEditingRoundIdx !== idx){
    const delta = r.result.ovr_change;
    const deltaFg = delta>0 ? 'var(--teal)' : (delta<0 ? 'var(--crimson)' : 'var(--ink-dim)');
    const deltaText = delta>0 ? `+${delta}` : (delta===0?'±0':`${delta}`);
    const item = el(`
      <div class="h-item">
        <div class="h-item-top" style="cursor:pointer;">
          <div class="rn">รอบ ${r.roundNumber}</div>
          <div class="hl">${escapeHtml(r.result.headline||'—')}</div>
          <div class="delta" style="color:${deltaFg}">${deltaText} → ${r.ovrAfter}</div>
        </div>
        <div class="h-item-body" style="display:block;">
          ${r.stats.ppg} PPG · ${r.stats.rpg} RPG · ${r.stats.apg} APG${r.stats.fg!=null?` · FG ${r.stats.fg}%`:''}${r.stats.three!=null?` · 3P ${r.stats.three}%`:''} · อันดับทีม ${r.stats.teamRank}
          <div style="margin-top:10px;display:flex;gap:8px;">
            <button class="ghost-btn" style="margin-top:0;flex:1;" data-act="edit">✏️ แก้ไขรอบนี้</button>
            <button class="ghost-btn" style="margin-top:0;flex:0 0 auto;border-color:var(--crimson);color:var(--crimson);" data-act="del">ลบ</button>
          </div>
        </div>
      </div>
    `);
    item.querySelector('[data-act=edit]').onclick = ()=>{ state.adminEditingRoundIdx = idx; render(); };
    item.querySelector('[data-act=del]').onclick = ()=>{
      showConfirm(`ลบรอบที่ ${r.roundNumber} ถาวรใช่หรือไม่?`, async ()=>{
        p.rounds.splice(idx,1);
        p.rounds.forEach((rr,i)=>{ rr.roundNumber = i+1; });
        p.ovr = p.rounds.length ? p.rounds[p.rounds.length-1].ovrAfter : p.startingOvr ?? 60;
        await persistAllProfiles();
        render();
      });
    };
    return item;
  }

  // Edit form for this round
  const card = el(`
    <div class="form-card">
      <h3>แก้ไขรอบที่ ${r.roundNumber}</h3>
      <div class="row3">
        <div><label>เกมที่ลงเล่น</label><input type="number" id="arGames" value="${r.stats.games}"></div>
        <div><label>PPG</label><input type="number" step="0.1" id="arPpg" value="${r.stats.ppg}"></div>
        <div><label>RPG</label><input type="number" step="0.1" id="arRpg" value="${r.stats.rpg}"></div>
      </div>
      <label>APG</label>
      <input type="number" step="0.1" id="arApg" value="${r.stats.apg}">
      <div class="row2">
        <div><label>FG% (รวมทั้งรอบ)</label><input type="number" step="0.1" id="arFg" value="${r.stats.fg ?? ''}"></div>
        <div><label>3P% (รวมทั้งรอบ)</label><input type="number" step="0.1" id="arThree" value="${r.stats.three ?? ''}"></div>

      <div class="row2">
        <div>
          <label>เกรด</label>
          <select id="arGrade">${['S','A','B','C','D'].map(g=>`<option value="${g}" ${g===r.result.grade?'selected':''}>${g}</option>`).join('')}</select>
        </div>
        <div>
          <label>OVR หลังจบรอบนี้ (40-99)</label>
          <input type="number" id="arOvrAfter" value="${r.ovrAfter}" min="40" max="99">
        </div>
      </div>
      <label>พาดหัว</label>
      <input type="text" id="arHeadline" value="${escapeHtml(r.result.headline||'')}">
      <label>คำบรรยาย</label>
      <textarea id="arCommentary" rows="3">${escapeHtml(r.result.commentary||'')}</textarea>
      <label>คำแนะนำแท็กติก</label>
      <textarea id="arTactical" rows="2">${escapeHtml(r.result.tactical_advice||'')}</textarea>
      <div class="btn-pair">
        <button class="primary-btn" id="arSave">💾 บันทึก</button>
        <button class="ghost-btn" id="arCancel">ยกเลิก</button>
      </div>
    </div>
  `);
  card.querySelector('#arCancel').onclick = ()=>{ state.adminEditingRoundIdx = null; render(); };
  card.querySelector('#arSave').onclick = async ()=>{
    const games = parseFloat(card.querySelector('#arGames').value) || 0;
    const ppg = parseFloat(card.querySelector('#arPpg').value) || 0;
    const rpg = parseFloat(card.querySelector('#arRpg').value) || 0;
    const apg = parseFloat(card.querySelector('#arApg').value) || 0;
    const fgRaw = card.querySelector('#arFg').value;
    const fg = fgRaw === '' ? null : parseFloat(fgRaw);
    const threeRaw = card.querySelector('#arThree').value;
    const three = threeRaw === '' ? null : parseFloat(threeRaw);
    const rank = parseFloat(card.querySelector('#arRank').value) || 0;
    const notes = card.querySelector('#arNotes').value.trim();
    const grade = card.querySelector('#arGrade').value;
    let ovrAfter = Math.round(parseFloat(card.querySelector('#arOvrAfter').value));
    if(isNaN(ovrAfter)) ovrAfter = r.ovrAfter;
    ovrAfter = Math.max(40, Math.min(99, ovrAfter));
    const headline = card.querySelector('#arHeadline').value.trim();
    const commentary = card.querySelector('#arCommentary').value.trim();
    const tactical_advice = card.querySelector('#arTactical').value.trim();

    r.stats = { games, ppg, rpg, apg, fg, three, teamRank: rank, notes };
    r.ovrAfter = ovrAfter;
    r.result = { ovr_change: ovrAfter - r.ovrBefore, grade, headline, commentary, tactical_advice, highlights: r.result.highlights || [] };

    // Keep the chain consistent: if this is the last round, sync the character's current OVR
    if(idx === p.rounds.length - 1){ p.ovr = ovrAfter; }

    state.adminEditingRoundIdx = null;
    await persistAllProfiles();
    render();
  };
  return card;
}

function careerAverages(rounds){
  if(rounds.length===0) return null;
  const n = rounds.length;
  const sum = (k)=>rounds.reduce((a,r)=>a+Number(r.stats[k]||0),0);
  return {
    ppg:(sum('ppg')/n).toFixed(1),
    rpg:(sum('rpg')/n).toFixed(1),
    apg:(sum('apg')/n).toFixed(1),
  };
}

function getHotStreak(rounds){
  let streak = 0;
  for(let i=rounds.length-1; i>=0; i--){
    if(rounds[i].result.ovr_change > 0) streak++;
    else break;
  }
  return streak;
}

function getAchievements(profile){
  const r = profile.rounds;
  const list = [
    {icon:'🎬', label:'ก้าวแรกสู่อาชีพ', unlocked: r.length>=1},
    {icon:'📈', label:'ผ่านมา 5 รอบ', unlocked: r.length>=5},
    {icon:'🎖️', label:'ทหารผ่านศึก 10 รอบ', unlocked: r.length>=10},
    {icon:'🥈', label:'ทะลุระดับซิลเวอร์ (70 OVR)', unlocked: profile.ovr>=70},
    {icon:'🥇', label:'ทะลุระดับโกลด์ (80 OVR)', unlocked: profile.ovr>=80},
    {icon:'💜', label:'ทะลุระดับอเมทิสต์ (85 OVR)', unlocked: profile.ovr>=85},
    {icon:'💎', label:'ทะลุระดับพิงค์ไดมอนด์ (90 OVR)', unlocked: profile.ovr>=90},
    {icon:'⭐', label:'ปลดล็อกเกรด S ครั้งแรก', unlocked: r.some(x=>x.result.grade==='S')},
    {icon:'🏆', label:'พาทีมขึ้นอันดับ 1 ของลีก', unlocked: r.some(x=>x.stats.teamRank===1)},
    {icon:'🔥', label:'ฟอร์มร้อนแรง 3 รอบติด', unlocked: getHotStreak(r)>=3 || (()=>{
      let best=0,cur=0;
      r.forEach(x=>{ if(x.result.ovr_change>0){cur++; best=Math.max(best,cur);} else cur=0; });
      return best>=3;
    })()},
  ];
  return list;
}

function avgOf(values){
  const nums = values.map(v=>parseFloat(v)).filter(v=>!isNaN(v));
  if(nums.length===0) return null;
  return +(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(1);
}

function sumOf(values){
  return values.map(v=>parseFloat(v)).filter(v=>!isNaN(v)).reduce((a,b)=>a+b,0);
}

function combinedPct(makesValues, attemptsValues){
  const totalMakes = sumOf(makesValues);
  const totalAttempts = sumOf(attemptsValues);
  if(totalAttempts <= 0) return null;
  return +((totalMakes/totalAttempts)*100).toFixed(1);
}

function readNum(el, def=null){
  const v = parseFloat(el.value);
  return isNaN(v) ? def : v;
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

function generateLocalAnalysis(profile, input, roundNumber){
  const {games, ppg, rpg, apg, rank} = input;
  const fg = input.fg ?? null;
  const three = input.three ?? null;
  const pos = profile.position;

  // Position-aware expectations: bigs are graded more on RPG, guards more on APG,
  // so the same raw stat line grades differently depending on role — like real 2K badges.
  const apgBase = pos==='PG' ? 4 : pos==='SG' ? 2.5 : 2;
  const apgCap  = pos==='PG' ? 10 : pos==='SG' ? 6.5 : 6;
  const rpgBase = (pos==='C'||pos==='PF') ? 5 : pos==='SF' ? 3 : 2;
  const rpgCap  = (pos==='C'||pos==='PF') ? 12 : pos==='SF' ? 7 : 5;

  // Each category contributes a capped, partial-credit score — no single stat can carry the round alone.
  const scorePts = clamp((ppg-8)/10, -0.3, 2.0);        // 2.0 pts max — needs real volume scoring
  const astPts   = clamp((apg-apgBase)/(apgCap-apgBase)*1.5, -0.2, 1.5);
  const rebPts   = clamp((rpg-rpgBase)/(rpgCap-rpgBase)*1.5, -0.2, 1.5);
  const fgPts    = fg!==null ? clamp((fg-38)/22, -0.3, 1.0) : 0.4; // neutral credit if FG wasn't tracked
  const threePts = three!==null ? clamp((three-30)/25, 0, 0.5) : 0;
  const rankPts  = clamp((16-rank)/15*1.5, -0.5, 1.5);

  const rawScore = scorePts + astPts + rebPts + fgPts + threePts + rankPts; // max ≈ 8.0

  // The higher the current OVR, the more of that raw score gets "taxed" away —
  // climbing from 60→70 is easy, but 90→99 demands a genuinely elite round every time.
  const climbTax = Math.max(0, profile.ovr - 60) * 0.11;
  const effective = rawScore - climbTax;

  let change = effective>=4 ? 3 : effective>=2.3 ? 2 : effective>=0.8 ? 1 : effective>=-0.8 ? 0 : -1;
  let grade  = effective>=4 ? 'S' : effective>=2.8 ? 'A' : effective>=0.8 ? 'B' : effective>=-0.8 ? 'C' : 'D';

  const highlights = [];
  if(ppg>=25) highlights.push(`ทำคะแนนเฉลี่ย ${ppg} แต้มต่อเกม ระเบิดฟอร์มการทำคะแนนเต็มสูบ!`);
  else if(ppg>=18) highlights.push(`รักษาคะแนนเฉลี่ย ${ppg} แต้มต่อเกมได้อย่างมั่นคง`);
  if(astPts>=1.1) highlights.push(`แจกแอสซิสต์เฉลี่ย ${apg} ครั้งต่อเกม เล่นเป็นผู้นำเกมรุกได้ยอดเยี่ยม`);
  if(rebPts>=1.1) highlights.push(`คุมรีบาวด์เฉลี่ย ${rpg} ลูกต่อเกม ครองพื้นที่ใต้แป้นได้เหนียวแน่น`);
  if(fg!==null && fg>=50) highlights.push(`ยิงแม่นถึง ${fg}% จากสนามรวมทั้งรอบ เกมรุกมีประสิทธิภาพสูงมาก`);
  if(three!==null && three>=38) highlights.push(`ซัดสามแต้มแม่น ${three}% รวมทั้งรอบ เป็นภัยคุกคามจากรอบนอกตลอดเวลา`);
  if(rank<=8) highlights.push(`ทีมไต่ขึ้นมาอยู่อันดับ ${rank} ของลีก ฟอร์มทีมกำลังไปได้สวย`);
  if(input.notes) highlights.push(`โมเมนต์ที่แฟนบอลจดจำ: ${input.notes}`);
  if(highlights.length===0) highlights.push('เกมที่ผ่านมายังไม่มีจุดเด่นชัดเจน ต้องหาจังหวะสร้างผลงานให้มากกว่านี้');

  let tacticKey = 'balanced';
  if(fg!==null && fg<43) tacticKey='low_fg';
  else if(rebPts<0 && (pos==='C'||pos==='PF')) tacticKey='low_reb';
  else if(astPts<0 && pos==='PG') tacticKey='low_ast';
  else if(rank>=20) tacticKey='low_rank';
  else if(grade==='S') tacticKey='peak';

  const commentary = `รอบที่ ${roundNumber} ของ ${profile.name} (${profile.position}, ${profile.team}) จบลงด้วยค่าเฉลี่ย ${ppg} แต้ม ${rpg} รีบาวด์ และ ${apg} แอสซิสต์ต่อเกม จาก ${games} นัดที่ลงสนาม ${fg!==null?`ยิงเปอร์เซ็นต์จากสนามรวมทั้งรอบได้ ${fg}% `:''}${three!==null?`และซัดสามแต้มรวม ${three}% `:''}ทีมตอนนี้อยู่อันดับ ${rank} ของลีก ถือเป็นผลงานระดับเกรด ${grade} ที่${grade==='S'||grade==='A'?'ทำให้แฟนๆ ต้องพูดถึงกันทั้งลีก':grade==='B'?'ยังพอเชื่อใจได้ในสถานการณ์ปัจจุบัน':'ต้องกลับไปทบทวนกันยาวๆ'}`;

  return {
    ovr_change: change,
    grade,
    headline: pick(HEADLINES[grade]),
    commentary,
    highlights: highlights.slice(0,4),
    tactical_advice: pick(TACTICAL[tacticKey])
  };
}

async function submitRound(card){
  let games, ppg, rpg, apg, fg, three;

  if(state.roundEntryMode === 'perGame'){
    capturePerGameRows(card);
    const rows = state.perGameRows.filter(r => r.ppg!=='' || r.rpg!=='' || r.apg!=='');
    if(rows.length === 0){
      alert('กรุณากรอกสถิติอย่างน้อย 1 เกม');
      return;
    }
    games = rows.length;
    ppg = avgOf(rows.map(r=>r.ppg));
    rpg = avgOf(rows.map(r=>r.rpg));
    apg = avgOf(rows.map(r=>r.apg));
    fg = combinedPct(rows.map(r=>r.fgm), rows.map(r=>r.fga));
    three = combinedPct(rows.map(r=>r.tpm), rows.map(r=>r.tpa));
    if([ppg,rpg,apg].some(v=>v===null)){
      alert('กรุณากรอก PPG, RPG, APG ให้ครบอย่างน้อย 1 เกม');
      return;
    }
  } else {
    games = readNum(card.querySelector('#fGames'));
    ppg = readNum(card.querySelector('#fPpg'));
    rpg = readNum(card.querySelector('#fRpg'));
    apg = readNum(card.querySelector('#fApg'));
    fg = readNum(card.querySelector('#fFg'));
    three = readNum(card.querySelector('#fThree'));
    if([games,ppg,rpg,apg,fg].some(v=>v===null)){
      alert('กรุณากรอกข้อมูลสถิติหลักให้ครบ (เกม, PPG, RPG, APG, FG%)');
      return;
    }
  }

  const rank = readNum(card.querySelector('#fRank'));
  const notes = card.querySelector('#fNotes').value.trim();

  if(rank===null){
    alert('กรุณากรอกอันดับทีมในลีก');
    return;
  }

  state.formOpen = false;
  state.loading = true;
  state.error = null;
  state.perGameRows = [];
  render();

  const p = state.profile;
  const roundNumber = p.rounds.length + 1;

  const result = generateLocalAnalysis(p, {games, ppg, rpg, apg, fg, three, rank, notes}, roundNumber);

  try{
    let change = Math.round(Number(result.ovr_change ?? 0));
    if(isNaN(change)) change = 0;
    change = Math.max(-3, Math.min(3, change));
    const ovrBefore = p.ovr;
    let ovrAfter = ovrBefore + change;
    ovrAfter = Math.max(40, Math.min(99, ovrAfter));

    const roundRecord = {
      roundNumber,
      timestamp: new Date().toISOString(),
      stats: { games, ppg, rpg, apg, fg, three, teamRank: rank, notes },
      ovrBefore, ovrAfter,
      result: {
        ovr_change: ovrAfter - ovrBefore,
        grade: result.grade || '-',
        headline: result.headline || '',
        commentary: result.commentary || '',
        highlights: Array.isArray(result.highlights) ? result.highlights : [],
        tactical_advice: result.tactical_advice || ''
      }
    };

    p.rounds.push(roundRecord);
    p.ovr = ovrAfter;
    state.lastResultRoundIdx = p.rounds.length - 1;
    state.bumpAnim = true;
    await persistAllProfiles();
  }catch(e){
    console.error(e);
    state.error = 'วิเคราะห์ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง (' + (e.message||'เกิดข้อผิดพลาด') + ')';
  }finally{
    state.loading = false;
    render();
  }
}

function gradeColor(g){
  switch(g){
    case 'S': return {bg:'rgba(255,111,165,0.15)', fg:'var(--diamond)'};
    case 'A': return {bg:'rgba(232,184,75,0.15)', fg:'var(--gold)'};
    case 'B': return {bg:'rgba(47,184,198,0.15)', fg:'var(--teal)'};
    case 'C': return {bg:'rgba(154,164,172,0.15)', fg:'var(--silver)'};
    default: return {bg:'rgba(226,72,61,0.15)', fg:'var(--crimson)'};
  }
}

function renderAnalysisCard(round){
  const g = gradeColor(round.result.grade);
  const delta = round.result.ovr_change;
  const deltaColor = delta>0 ? 'rgba(47,184,198,0.15)' : (delta<0 ? 'rgba(226,72,61,0.15)' : 'rgba(154,164,172,0.15)');
  const deltaFg = delta>0 ? 'var(--teal)' : (delta<0 ? 'var(--crimson)' : 'var(--ink-dim)');
  const deltaText = delta>0 ? `+${delta} OVR` : (delta<0 ? `${delta} OVR` : '±0 OVR');

  return el(`
    <div class="analysis-card">
      <div class="analysis-top">
        <div style="flex:1;">
          <div class="ovr-delta" style="background:${deltaColor};color:${deltaFg};">${deltaText} → ${round.ovrAfter} OVR</div>
        </div>
        <div class="grade" style="background:${g.bg};color:${g.fg};">${escapeHtml(round.result.grade)}</div>
      </div>
      <div class="headline">${escapeHtml(round.result.headline)}</div>
      <p class="commentary">${escapeHtml(round.result.commentary)}</p>
      ${round.result.highlights.length ? `<ul class="highlights">${round.result.highlights.map(h=>`<li>🔥 ${escapeHtml(h)}</li>`).join('')}</ul>` : ''}
      <div class="tactical">
        <h4>แผนสำหรับรอบหน้า</h4>
        <p>${escapeHtml(round.result.tactical_advice)}</p>
      </div>
    </div>
  `);
}

function renderHistory(){
  const p = state.profile;
  const wrap = el(`<div class="history"><h3>ประวัติการแข่งขันทั้งหมด</h3></div>`);
  if(p.rounds.length===0){
    wrap.appendChild(el(`<div class="empty-hist">ยังไม่มีข้อมูลรอบการแข่งขัน — บันทึกรอบแรกของคุณเลย!</div>`));
    return wrap;
  }
  [...p.rounds].reverse().forEach((r)=>{
    const realIdx = p.rounds.indexOf(r);
    const delta = r.result.ovr_change;
    const deltaFg = delta>0 ? 'var(--teal)' : (delta<0 ? 'var(--crimson)' : 'var(--ink-dim)');
    const deltaText = delta>0 ? `+${delta}` : (delta===0?'±0':`${delta}`);
    const item = el(`
      <div class="h-item ${state.openHistIdx===realIdx?'open':''}">
        <div class="h-item-top">
          <div class="rn">รอบ ${r.roundNumber}</div>
          <div class="hl">${escapeHtml(r.result.headline||'—')}</div>
          <div class="delta" style="color:${deltaFg}">${deltaText} → ${r.ovrAfter}</div>
        </div>
        <div class="h-item-body">
          ${r.stats.ppg} PPG · ${r.stats.rpg} RPG · ${r.stats.apg} APG${r.stats.fg!=null?` · FG ${r.stats.fg}%`:''}${r.stats.three!=null?` · 3P ${r.stats.three}%`:''} · อันดับทีม ${r.stats.teamRank}<br><br>
          ${escapeHtml(r.result.commentary)}<br><br>
          <b style="color:var(--teal)">แท็กติกที่แนะนำ:</b> ${escapeHtml(r.result.tactical_advice)}
        </div>
      </div>
    `);
    item.onclick = ()=>{
      state.openHistIdx = state.openHistIdx===realIdx ? null : realIdx;
      render();
    };
    wrap.appendChild(item);
  });
  return wrap;
}

let chartInstance = null;
function drawChart(p){
  const canvas = document.getElementById('ovrChart');
  if(!canvas || typeof Chart === 'undefined') return;
  if(chartInstance){ chartInstance.destroy(); }
  const labels = ['เริ่มต้น', ...p.rounds.map(r=>'รอบ '+r.roundNumber)];
  const data = [p.startingOvr ?? 60, ...p.rounds.map(r=>r.ovrAfter)];
  chartInstance = new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{
      labels,
      datasets:[{
        data,
        borderColor:'#F2B705',
        backgroundColor:'rgba(242,183,5,0.12)',
        borderWidth:2.5,
        pointBackgroundColor:'#F2B705',
        pointRadius:3,
        tension:0.35,
        fill:true,
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{
        x:{ ticks:{ color:'#8B93A1', font:{size:10} }, grid:{ color:'#262E3D' } },
        y:{ ticks:{ color:'#8B93A1', font:{size:10} }, grid:{ color:'#262E3D' }, min:Math.min(55,(p.startingOvr??60)-5), max:99 }
      }
    }
  });
}

function escapeHtml(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
